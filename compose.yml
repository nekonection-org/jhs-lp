services:
  web:
    image: jhs-lp:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_DISCORD_INVITE_URL: ${NEXT_PUBLIC_DISCORD_INVITE_URL:-}
        NEXT_PUBLIC_RUST_SERVER_ADDRESS: ${NEXT_PUBLIC_RUST_SERVER_ADDRESS:-}
        NEXT_PUBLIC_TEBEX_URL: ${NEXT_PUBLIC_TEBEX_URL:-}
        NEXT_PUBLIC_MODERATOR_APPLICATION_URL: ${NEXT_PUBLIC_MODERATOR_APPLICATION_URL:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
